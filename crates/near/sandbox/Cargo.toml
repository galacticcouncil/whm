[package]
name = "ntt-sandbox"
version = "0.1.0"
edition = "2021"
publish = false

# End-to-end tests only — a separate crate so `near-workspaces` (and its sandbox binary, which
# ships for linux-x86_64, linux-aarch64 and darwin-arm64 only) stays out of the contract's unit tests.

[dev-dependencies]
ntt-manager = { path = "../contracts/ntt-manager" }
# The contract crate on the host: its codec uses `env::keccak256`, mocked under `unit-testing`.
near-sdk = { workspace = true, features = ["unit-testing"] }
hex = { workspace = true }
near-workspaces = { version = "0.22", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde = "1"
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
