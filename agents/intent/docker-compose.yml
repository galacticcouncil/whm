version: "3.3"
# One image, one service per app. The command names the entry point — nothing is selected at
# runtime, and the banner says which app a container is.
services:
  # Prices the destination relay fee. Stateless, read-only, no keys.
  app-quoter:
    image: galacticcouncil/intent:latest
    command: [node, quoter/app.js]
    environment:
      # Gas price and the guardian set are read here; the envelope itself is code.
      - ETH_RPC=
    ports:
      - "8080:8080"
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  # Tells 1Click a deposit landed. Without it an order stops at `processed` and never resolves.
  app-relayer:
    image: galacticcouncil/intent:latest
    command: [node, relayer/app.js]
    environment:
      # Websocket: OrderProcessed arrives over eth_subscribe, never by polling.
      - ETH_WSS=
      - INTENT_RECEIVER=0x2173F6ecE25768e7EFc5199f70f8783d88Ba63c8
    ports:
      - "8081:8080"
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  # Intents v2 on NEAR: has the router sign each set of terms' swap, delivery or refund, and
  # sends it — once. A failure is alerted with a one-time reprocess link and waits for a person;
  # Redis keeps those and the orders already swapped.
  app-router:
    image: galacticcouncil/intent:latest
    command: [node, router/app.js]
    environment:
      - REDIS_HOST=redis
      # Alerts: failed attempts, a failing pass, a low balance.
      - DISCORD_WEBHOOK_URL=
      # Where /reprocess/:id is reachable from outside — the alerts link to it.
      - PUBLIC_URL=
      # The scan intents-v2 app — the terms in play and their orders.
      - SCAN_API=
      - RPC_NEAR=https://free.rpc.fastnear.com
      - ROUTER=intents-router.hydration-whm.near
      # The bot's account and a FULL-ACCESS key: every router call attaches 1 yocto, which a
      # function-call key cannot. Hold only gas money on it.
      - NEAR_ACCOUNT=
      - NEAR_PRIVKEY=
      # 1Click partner key; its quotes must be signed by a key in the router's quote_keys.
      - ONECLICK_KEY=
    ports:
      - "8082:8080"
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  redis:
    image: redis:latest
    isolation: default
    volumes:
     - db:/data
    networks:
     - default
    logging:
      driver: json-file

volumes:
  db:

networks:
  default:
    driver: overlay
