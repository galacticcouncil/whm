version: "3.3"
services:
  app-intents:
    image: galacticcouncil/scan:latest
    command: [node, intents/app.js]
    environment:
      - DATABASE_URL=postgres://scan:scan@postgres:5432/scan
      # Asset symbols are read from Hydration once at boot; nothing else here touches a chain.
      - RPC_HYDRATION_WSS=
      # The off-chain leg. Without it an order stops at `processed` and never resolves.
      - ONECLICK_JWT=
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  app-transfers:
    image: galacticcouncil/scan:latest
    command: [node, transfers/app.js]
    environment:
      - DATABASE_URL=postgres://scan:scan@postgres:5432/scan
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  app-feeds:
    image: galacticcouncil/scan:latest
    command: [node, feeds/app.js]
    environment:
      - DATABASE_URL=postgres://scan:scan@postgres:5432/scan
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  # Every page, on one origin: Transfers, Orders, Feeds. Each section's API calls are proxied to its
  # app over the compose network; the apps keep their own ports for anyone using the APIs directly.
  ui:
    image: galacticcouncil/scan:latest
    command: [node, ui/app.js]
    environment:
      - TRANSFERS_API=http://app-transfers:8080
      - ORDERS_API=http://app-intents:8080
      - FEEDS_API=http://app-feeds:8080
    ports:
      - "8083:8080"
    depends_on:
      - app-transfers
      - app-intents
      - app-feeds
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  # One image, one service per domain. The command names the entry point — nothing is selected at
  # runtime. Only ingest writes to `events`, `wh_messages` and `ntt_transfers`; the rest read them.
  #
  # What to index — chain ids, contract addresses, start blocks — is code, in src/chains.ts and
  # src/watch.ts. Only endpoints and secrets are set here.
  ingest:
    image: galacticcouncil/scan:latest
    command: [node, ingest/app.js]
    environment:
      # EVM RPCs must be websocket: heads arrive over eth_subscribe, never by polling.
      - RPC_ETHEREUM_WSS=
      - RPC_BASE_WSS=
      # No public websocket on these two: `_HTTP` polls heads on the sweep.
      - RPC_ROBINHOOD_HTTP=https://rpc.mainnet.chain.robinhood.com
      - RPC_HYPEREVM_HTTP=https://rpc.hyperliquid.xyz/evm
      # Hydration MUST be the substrate path — the landing's deliveries are XCM-driven pallet_evm
      # calls with no eth receipt, so only Frontier EVM.Log substrate events expose them.
      - RPC_HYDRATION_WSS=
      # Optional — public endpoints by default. A Solana websocket only wakes the poll sooner.
      - RPC_SOLANA_HTTP=
      - RPC_SOLANA_WSS=
      - DATABASE_URL=postgres://scan:scan@postgres:5432/scan
    depends_on:
      - postgres
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=scan
      - POSTGRES_PASSWORD=scan
      - POSTGRES_DB=scan
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    logging:
      driver: json-file

networks:
  default:
    driver: overlay

volumes:
  pgdata:
    driver: local
