<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Transfer · Hydration xchain</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/GazpachoMedium-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMonoMedium-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <main class="wrap" id="main">
      <div class="panel"><div class="table-error">loading…</div></div>
    </main>

    <script type="module">
      import {
        addrLink,
        at,
        agoLong,
        badge,
        chainBadge,
        chainLabel,
        dl,
        esc,
        eventLink,
        json,
        legCard,
        live,
        refId,
        refLink,
        short,
        statusBadge,
        tokenAmount,
        amount,
        topbar,
        txLink,
        vaaLink,
        copyBtn,
      } from "/shared/app.js";

      topbar("xchain", [["/", "Transfers"]]);

      // Also answers the bare `/transfer`, which has nothing to show — the list is the root.
      const id = decodeURIComponent(location.pathname.split("/")[2] ?? "");
      if (!id) location.replace("/");

      const main = document.getElementById("main");
      const dim = '<span class="dim">—</span>';
      const mono = (v) => (v !== null && v !== undefined && v !== "" ? `<span class="mono">${esc(v)}</span>` : dim);

      const TYPE = {
        transfer: "Transfer",
        intent: "Intent",
        deposit: "Deposit",
        withdraw: "Withdraw",
        basejump: "Basejump",
      };

      let assets = [];

      /** The view's token, drawn the explorer's way: icon, symbol, amount. */
      const money = (raw, v) => {
        const m = assets.find((a) => a.symbol === v.symbol) ?? { symbol: v.symbol, assetId: null };
        return tokenAmount(raw, { ...m, decimals: v.decimals ?? 18 }, 8);
      };

      /**
       * Every fee a transfer paid: the total, and — where more than one party took a cut — a tree
       * under it branching out to each, so the parts visibly add up to the total.
       *
       * @param v The view — symbol and precision.
       * @param parts `[who, raw]`; an absent or zero part is left out.
       */
      function fees(v, parts) {
        const paidParts = parts.filter(([, raw]) => raw !== null && raw !== undefined && BigInt(raw) > 0n);
        if (!paidParts.length) return dim;
        const total = paidParts.reduce((s, [, raw]) => s + BigInt(raw), 0n).toString();
        const dp = v.decimals ?? 18;
        const tree =
          paidParts.length > 1
            ? `<div class="fee-tree">${paidParts
                .map(
                  ([who, raw]) =>
                    `<div class="br"><span class="who">${esc(who)}</span><span class="amt">${esc(amount(raw, dp, 8))}</span></div>`,
                )
                .join("")}</div>`
            : "";
        return `${money(total, v)}${tree}`;
      }

      /** A withdrawal's whole cost: what crossed plus the emitter's fee, as raw units. */
      const paid = (r) =>
        r.amount === null || r.amount === undefined ? null : (BigInt(r.amount) + BigInt(r.fee ?? 0)).toString();

      /**
       * An event reference: its transaction linked, with a copy button and the explorer as a chip. A
       * Hydration event that came in as a substrate call has no transaction, only its block-and-event
       * identity — eventLink renders that, so it is passed the whole reference, never just a hash.
       */
      const ref = (r) =>
        r ? `<span class="txl">${eventLink(r)}${copyBtn(refId(r))}</span>${refLink(r)}` : dim;

      /** The NTT hop every rail but Basejump rides: published, then delivered. */
      function rail(v, r, since, prefix = "rail_") {
        const published = r[`${prefix}published`] ?? r.published;
        const settled = r[`${prefix}settled`] ?? r.settled;
        const state = r[`${prefix}state`] ?? r.state;
        const held = state === "queued";
        return [
          legCard({
            where: "wormhole",
            kind: "published",
            ref: published,
            rows: r.vaa_id ? [["vaa", vaaLink(r.vaa_id)]] : [],
            since,
          }),
          legCard({
            where: v.kind === "utxo" && v.type === "withdraw" ? "near" : v.to_chain,
            kind: held ? "rate limited" : "delivered",
            ref: settled,
            held,
            rows: held ? [["", '<span class="dim">held by the inbound rate limiter</span>']] : [],
            since,
          }),
        ];
      }

      /**
       * The route, start to end, for each rail. A hop not yet taken is dimmed rather than dropped —
       * where a transfer stopped is the thing worth seeing.
       */
      const ROUTE = {
        ntt(v, r) {
          const since = r.published?.blockTimestamp;
          return [
            legCard({ where: v.from_chain, kind: "sent", ref: r.published, rows: [["", money(v.amount, v)]] }),
            ...rail(v, r, since, ""),
          ];
        },

        utxo(v, r) {
          if (v.type === "deposit") {
            const since = r.deposited?.blockTimestamp;
            return [
              legCard({
                where: r.chain,
                kind: "paid",
                rows: [
                  ["", txLink(r.utxo_tx, r.chain)],
                  ["", money(r.amount, v)],
                ],
              }),
              legCard({
                where: "near",
                kind: r.deposit_ok === false ? "refused" : "proven",
                ref: r.deposited,
                held: r.deposit_ok === false,
                rows:
                  r.deposit_ok === false
                    ? [["", '<span class="dim">the manager refused the mint — refundable to the refund address</span>']]
                    : [],
                since,
              }),
              ...rail(v, r, since),
            ];
          }
          const since = r.requested?.blockTimestamp;
          return [
            legCard({ where: "hydration", kind: "sent", ref: r.requested, rows: [["", money(paid(r), v)]] }),
            ...rail(v, r, since),
            legCard({
              where: "near",
              kind: "signed",
              ref: r.sign,
              rows: r.sign_amount ? [["", money(r.sign_amount, v)]] : [],
              since,
            }),
            legCard({
              where: "near",
              kind: "withdrawn",
              ref: r.withdrawn,
              rows: r.utxo_tx ? [["payout", txLink(r.utxo_tx, r.chain)]] : [],
              since,
            }),
            legCard({
              where: r.chain,
              kind: "confirmed",
              ref: r.confirmed,
              rows: r.received ? [["", money(r.received, v)]] : [],
              since,
            }),
          ];
        },

        basejump(v, r) {
          const since = r.initiated?.blockTimestamp;
          const queued = !!r.queued;
          return [
            legCard({ where: v.from_chain, kind: "initiated", ref: r.initiated, rows: [["", money(r.gross_amount, v)]] }),
            legCard({
              where: v.to_chain,
              kind: queued ? "queued" : "paid out",
              ref: queued ? r.queued : r.completed,
              held: queued && !r.fulfilled,
              rows: queued ? [["", '<span class="dim">landing pool was short</span>']] : [["", money(r.net_amount, v)]],
              since,
            }),
            queued
              ? legCard({ where: v.to_chain, kind: "fulfilled", ref: r.fulfilled, rows: [["", money(r.net_amount, v)]], since })
              : "",
          ];
        },
      };

      /** The detail cards, per rail: [title, [[label, html]]]. */
      const PANELS = {
        ntt: (v, r) => [
          [
            "Transfer",
            [
              ["Amount", money(v.amount, v)],
              ["From", `${chainBadge(v.from_chain)}${addrLink(v.from_address, v.from_chain)}`],
              ["To", `${chainBadge(v.to_chain)}${addrLink(v.to_address, v.to_chain)}`],
              ["Origin transaction", ref(r.published)],
              ["Destination transaction", ref(r.settled)],
            ],
          ],
          [
            "NTT",
            [
              ["State", badge(r.state)],
              ["VAA", vaaLink(r.vaa_id)],
              ["Digest", r.digest ? `${mono(short(r.digest, 14, 10))}${copyBtn(r.digest)}` : dim],
              ["Manager sequence", mono(r.manager_sequence)],
            ],
          ],
        ],

        utxo: (v, r) => {
          const coin = r.chain;
          // Amount, fees, received — the same three rows every transfer has. A deposit's Omni fee is
          // taken inside the mint, so what crosses to Hydration is the NTT amount.
          const rows =
            v.type === "deposit"
              ? [
                  ["Amount", money(r.amount, v)],
                  ["Fees", fees(v, [["Omni (bridge)", r.bridge_fee]])],
                  ["Received", money(r.rail_amount ?? r.amount, v)],
                  ["Paid from", `${chainBadge(coin)}${addrLink(r.sender, coin)}`],
                  ["Deposit address", addrLink(r.deposit_address, coin)],
                  ["Refund address", addrLink(r.refund_address, coin)],
                  ["Recipient", `${chainBadge("hydration")}${addrLink(r.recipient, "hydration")}`],
                  [`${coin} transaction`, txLink(r.utxo_tx, coin)],
                  ["NEAR proof", ref(r.deposited)],
                  ["Hydration delivery", ref(r.rail_settled)],
                ]
              : [
                  ["Amount", money(paid(r), v)],
                  [
                    "Fees",
                    // What each cut pays for: the bots' NEAR costs, Omni's bridge, the payout's miners.
                    fees(v, [
                      ["Hydration (relay)", r.fee],
                      ["Omni (bridge)", r.bridge_fee],
                      [`${chainLabel(coin)} (miner)`, r.miner_fee],
                    ]),
                  ],
                  ["Received", money(r.received, v)],
                  ["Sender", `${chainBadge("hydration")}${addrLink(r.sender, "hydration")}`],
                  ["Recipient", `${chainBadge(coin)}${addrLink(r.recipient, coin)}`],
                  ["NEAR account", addrLink(r.near_account, "near")],
                  ["Hydration transaction", ref(r.requested)],
                  [`${coin} payout`, txLink(r.utxo_tx, coin)],
                ];
          return [
            [v.type === "deposit" ? "Deposit" : "Withdrawal", rows],
            [
              "NTT",
              [
                ["State", r.rail_state ? badge(r.rail_state) : dim],
                ["VAA", vaaLink(r.vaa_id)],
                ["Digest", r.digest ? `${mono(short(r.digest, 14, 10))}${copyBtn(r.digest)}` : dim],
              ],
            ],
          ];
        },

        basejump: (v, r) => [
          [
            "Transfer",
            [
              ["Amount", money(r.gross_amount, v)],
              ["Fees", fees(v, [["Basejump (fast path)", r.fee]])],
              ["Received", money(r.net_amount, v)],
              ["Sender", `${chainBadge(v.from_chain)}${addrLink(r.sender, v.from_chain)}`],
              ["Recipient", `${chainBadge(v.to_chain)}${addrLink(r.recipient, v.to_chain)}`],
              ["Origin transaction", ref(r.initiated)],
            ],
          ],
          [
            "Settlement",
            [
              ["NTT sequence", mono(r.transfer_sequence)],
              ["Message sequence", mono(r.message_sequence)],
              ["Pending queue id", mono(r.pending_id)],
            ],
          ],
        ],
      };

      function render(t) {
        if (!t) {
          main.innerHTML = `<div class="panel"><div class="table-error">No transfer ${esc(id)}.</div></div>`;
          return;
        }
        const { view: v, record: r } = t;
        const title = TYPE[v.type] ?? v.type;
        const cards = PANELS[v.kind](v, r)
          .map(
            ([head, body]) => `<div class="detail-card">
              <div class="panel-head"><span class="t">${esc(head)}</span></div>
              ${typeof body === "string" ? body : dl(body)}
            </div>`,
          )
          .join("");
        // Up to four steps share a row; five or six break into two rows of three.
        const legs = ROUTE[v.kind](v, r).filter(Boolean);
        const cols = legs.length <= 4 ? legs.length : 3;
        document.title = `${title} · Hydration xchain`;
        main.innerHTML = `
          <div class="crumbs"><a href="/">Transfers</a><span class="sep">/</span><span>${esc(title)}</span></div>
          <h1 class="page-title">${esc(title)}
            <span class="sub">${chainBadge(v.from_chain)}<span class="dim">→</span>${chainBadge(v.to_chain)}</span>
            ${statusBadge(v.status, { title: v.stage })}
          </h1>
          <div class="sec-title">Sent ${esc(agoLong(v.time))}${v.time ? ` <span class="dim">· ${esc(at(v.time))}</span>` : ""}</div>
          <div class="legs" style="--cols:${cols}">${legs.join("")}</div>
          ${cards}`;
      }

      async function load() {
        render(await json(`/api/transfers/${encodeURIComponent(id)}`));
      }

      // Every rail's changes: this page cannot tell from a notice which of its rows moved, and a
      // refetch is one request.
      let pending;
      json("/api/filters").then((f) => {
        assets = f?.assets ?? [];
        live(
          "ntt,utxo,utxo-signs,basejump",
          () => {
            clearTimeout(pending);
            pending = setTimeout(load, 300);
          },
          load,
        );
      });
    </script>
  </body>
</html>
