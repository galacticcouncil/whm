<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trades · Hydration scan</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/GazpachoMedium-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMonoMedium-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <main class="wrap">
      <label class="search xl">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="q" type="text" placeholder="Search by address" autocomplete="off" spellcheck="false" />
        <span class="hint">↵</span>
      </label>

      <div class="list-head">
        <div class="list-title tagged" id="title"><span class="conn"><span class="dot"></span></span>Live trades</div>
        <div class="fbar" id="fbar"><button type="button" class="freset" id="reset" hidden>Reset</button></div>
      </div>

      <div class="panel">
        <table class="tbl">
          <thead>
            <tr>
              <th>Time</th>
              <th>Type</th>
              <th>From</th>
              <th>To</th>
              <th>Assets</th>
              <th class="r">Status</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pager" id="pager"></div>
      </div>
    </main>

    <script type="module">
      import {
        NAV,
        addrLink,
        agoLong,
        asset,
        assetIcon,
        at,
        chainBadge,
        chainIcon,
        esc,
        filterDrop,
        filterToggle,
        icon,
        json,
        live,
        pager,
        pill,
        statusBadge,
        statusLabel,
        topbar,
        versionTag,
      } from "/shared/app.js";

      topbar("scan", NAV, { conn: false });
      document.getElementById("title").insertAdjacentHTML("beforeend", versionTag("new"));

      /** Intents v2, through the UI's proxy. */
      const API = "/api/v2";

      const LIMIT = 25;
      const COLS = 6;
      const STATES = ["pending", "closing", "completed", "refunded", "expired"];
      const el = (id) => document.getElementById(id);

      /** What A is credited and sells — the rail's unit. */
      const ETH = { symbol: "ETH", decimals: 18 };

      /**
       * The destinations the dispatcher prices, by intents ledger id: the price routes its owner sets.
       * Where a withdrawal lands is the asset's own chain — NEAR's own is native NEAR, unwrapped on
       * NEAR; an intents account stays on NEAR.
       */
      const DEST = {
        "nep141:zec.omft.near": { symbol: "ZEC", decimals: 8, chain: "zcash" },
        "nep141:wrap.near": { symbol: "NEAR", decimals: 24, chain: "near" },
      };
      const dest = (r) => DEST[r.destination_asset];
      const destChain = (r) => (r.recipient_kind === 1 ? "near" : (dest(r)?.chain ?? null));

      // ─── State, mirrored in the URL so a filtered view can be shared ───

      const url = new URLSearchParams(location.search);
      const state = { state: new Set((url.get("state") ?? "").split(",").filter(Boolean)) };
      let page = Math.max(1, Number(url.get("page") ?? 1));
      el("q").value = url.get("q") ?? "";
      const toggle = filterToggle(el("fbar"));

      function sync() {
        const p = new URLSearchParams();
        const q = el("q").value.trim();
        if (q) p.set("q", q);
        if (state.state.size) p.set("state", [...state.state].join(","));
        if (page > 1) p.set("page", page);
        history.replaceState(null, "", p.size ? `?${p}` : location.pathname);
        el("reset").hidden = !q && state.state.size === 0;
        toggle.count(state.state.size ? 1 : 0);
        return { q, states: [...state.state] };
      }

      // ─── Rows ───

      const when = (ms) =>
        ms
          ? `<span class="mono muted" title="${esc(at(ms))}">${agoLong(ms)}</span>`
          : '<span class="dim">—</span>';

      const end = (chain, address) =>
        `<span class="end-row">${chain ? chainBadge(chain) : ""}${addrLink(address, chain)}</span>`;

      /**
       * A trade of one order is a swap, of several a TWAP — by the orders its ICE intent was given,
       * else by those seen so far.
       */
      const type = (r) =>
        (r.planned ?? r.order_count) > 1 ? pill("Twap", "var(--lavender)") : pill("Swap", "var(--sky)");

      /**
       * What the trade sold — the Hydration asset its ICE orders sold, else the ETH — and what the user
       * has received so far.
       */
      function assets(r) {
        const d = dest(r);
        const meta = r.asset_in_meta;
        const sold =
          r.asset_in != null
            ? asset(r.amount_in, meta, `#${r.asset_in}`, assetIcon(meta?.icon ?? r.asset_in))
            : asset(r.sold, ETH, "", chainIcon("ethereum"));
        const out =
          Number(r.received) > 0
            ? asset(r.received, d, r.destination_asset ?? "", chainIcon(destChain(r)))
            : `<span class="asset-chip">${icon(chainIcon(destChain(r)), d?.symbol)}<span class="sym">${esc(d?.symbol ?? r.destination_asset ?? "?")}</span></span>`;
        return `<span class="assets">${sold}<span class="arrow">→</span>${out}</span>`;
      }

      let shown = new Set();

      function render(items, fresh) {
        if (!items.length) {
          el("rows").innerHTML = `<tr><td class="table-error" colspan="${COLS}">No trades match.</td></tr>`;
          shown = new Set();
          return;
        }
        el("rows").innerHTML = items
          .map((r) => {
            const href = `/v2/trade/${encodeURIComponent(r.auth_path)}`;
            const isNew = fresh && !shown.has(r.auth_path);
            return `<tr class="clickable${isNew ? " row-new" : ""}" data-href="${href}">
              <td data-label="Time">${when(r.last_at)}</td>
              <td data-label="Type">${type(r)}</td>
              <td data-label="From">${end("hydration", r.caller)}</td>
              <td data-label="To">${end(destChain(r), r.recipient)}</td>
              <td data-label="Assets">${assets(r)}</td>
              <td class="r" data-label="Status">${statusBadge(r.status)}</td>
            </tr>`;
          })
          .join("");
        shown = new Set(items.map((r) => r.auth_path));
      }

      function skeleton() {
        const widths = ["58%", "42%", "70%", "36%", "52%", "48%", "64%", "40%"];
        el("rows").innerHTML = Array.from(
          { length: 8 },
          (_, i) =>
            `<tr class="sk-tr">${Array.from({ length: COLS }, (_, j) => `<td style="--w:${widths[(i + j) % widths.length]}"></td>`).join("")}</tr>`,
        ).join("");
      }

      // Whole-row navigation, except where a link or a button was clicked.
      el("rows").addEventListener("click", (e) => {
        if (e.target.closest("a, button")) return;
        const href = e.target.closest("tr")?.dataset.href;
        if (href) location.href = href;
      });

      async function load(fresh = false) {
        const { q, states } = sync();
        const p = new URLSearchParams({ limit: LIMIT, offset: (page - 1) * LIMIT });
        if (q) p.set("address", q);
        if (states.length) p.set("status", states.join(","));
        el("rows").classList.add("rows-pending");
        const data = await json(`${API}/trades?${p}`);
        el("rows").classList.remove("rows-pending");
        if (!data) {
          el("rows").innerHTML =
            `<tr><td class="table-error" colspan="${COLS}"><strong>Could not load trades.</strong></td></tr>`;
          return;
        }
        render(data.items, fresh);
        el("pager").innerHTML = pager(page, Math.max(1, Math.ceil(data.total / LIMIT)));
      }

      el("pager").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-page]");
        if (!b || b.disabled) return;
        page = Number(b.dataset.page);
        load();
      });

      const refilter = () => {
        page = 1;
        load();
      };

      let typing;
      el("q").addEventListener("input", () => {
        clearTimeout(typing);
        typing = setTimeout(refilter, 300);
      });
      el("q").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          clearTimeout(typing);
          refilter();
        }
      });

      // ─── Status filter ───

      const host = document.createElement("div");
      el("fbar").insertBefore(host, el("reset"));
      const drop = filterDrop(
        host,
        {
          label: "Status",
          cols: [{ key: "state", options: STATES.map((s) => ({ value: s, label: statusLabel(s), html: statusBadge(s) })) }],
        },
        state,
        refilter,
      );
      el("reset").addEventListener("click", () => {
        el("q").value = "";
        state.state.clear();
        drop.paint();
        refilter();
      });

      // ─── Live ───

      // A change anywhere reloads the first page, and what arrived flashes. A burst coalesces.
      let pending;
      skeleton();
      live(
        "orders-v2,payouts-v2",
        () => {
          if (page !== 1) return;
          clearTimeout(pending);
          pending = setTimeout(() => load(true), 300);
        },
        () => load(),
      );
    </script>
  </body>
</html>
