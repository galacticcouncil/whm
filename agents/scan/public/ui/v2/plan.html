<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plan v2 · Hydration scan</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/GazpachoMedium-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMonoMedium-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <main class="wrap" id="main">
      <div class="panel"><div class="table-error">loading…</div></div>
    </main>

    <script type="module">
      import {
        NAV,
        addrLink,
        agoLong,
        asset,
        assetIcon,
        at,
        badge,
        chainIcon,
        copyBtn,
        destTxLink,
        esc,
        eventLink,
        json,
        kv,
        live,
        nearIntentsUrl,
        pill,
        short,
        topbar,
        versionTag,
      } from "/shared/app.js";

      topbar("scan", NAV);

      /** This section's app, through the UI's proxy. */
      const API = "/api/v2/orders";

      // `/v2/plan/<auth_path>`.
      const path = decodeURIComponent(location.pathname.split("/")[3] ?? "").toLowerCase();
      if (!path) location.replace("/v2/orders");

      const main = document.getElementById("main");
      const dim = (v) => `<span class="dim">${esc(v)}</span>`;

      /** What A is credited and sells — the rail's unit. */
      const ETH = { symbol: "ETH", decimals: 18 };

      /** The destinations the dispatcher prices, by intents ledger id — as on the list. */
      const DEST = {
        "nep141:zec.omft.near": { symbol: "ZEC", decimals: 8, chain: "zcash" },
      };
      /** Where a destination chain's payout transaction is shown. */
      const DEST_TX = { zcash: "zec" };

      const when = (ms) =>
        ms ? `<span class="mono muted" title="${esc(at(ms))}">${agoLong(ms)}</span>` : dim("—");

      /**
       * Every order of the plan, oldest first: its own route on its own page, and its swap's 1Click
       * execution once the router has signed it.
       */
      function tranches(orders) {
        const rows = orders
          .map(
            (o) => `<tr>
              <td class="mono"><a class="hash" href="/v2/order/${encodeURIComponent(o.seq)}">#${esc(o.seq)}</a></td>
              <td>${when(o.published?.blockTimestamp)}</td>
              <td>${asset(o.forwarded_amount ?? o.amount, ETH, "", chainIcon("ethereum"))}</td>
              <td>${
                o.swap_deposit
                  ? `<a class="link" href="${nearIntentsUrl(o.swap_deposit)}" target="_blank" rel="noreferrer">1Click execution ↗</a>`
                  : dim("—")
              }</td>
              <td class="r">${badge(o.state)}</td>
            </tr>`,
          )
          .join("");
        return `
          <div class="panel">
            <div class="panel-head"><span class="t">Tranches</span><span class="note">every order of this plan</span></div>
            <table class="tbl">
              <thead><tr><th>Order</th><th>Time</th><th>ETH</th><th>Swap</th><th class="r">Status</th></tr></thead>
              <tbody>${rows || `<tr><td class="table-error" colspan="5">none yet</td></tr>`}</tbody>
            </table>
          </div>`;
      }

      /**
       * Every payout, oldest first. A delivery shows where it landed — the transaction on the
       * destination chain once found, or NEAR for an intents recipient; a refund goes back to Ethereum.
       */
      function payouts(plan, list) {
        const d = DEST[plan.destination_asset];
        const chain = plan.recipient_kind === 1 ? "near" : (d?.chain ?? null);
        const rows = list
          .map((p) => {
            const refund = p.state === "refunded";
            const amount = refund ? asset(p.amount, ETH) : asset(p.amount, d, plan.destination_asset ?? "", chainIcon(chain));
            const landed =
              !refund && chain && chain !== "near"
                ? p.dest_tx
                  ? `${asset(p.dest_amount, d, plan.destination_asset ?? "", chainIcon(chain))} ·${destTxLink(p.dest_tx, null, DEST_TX[chain] ?? chain)}`
                  : dim("sending")
                : dim("—");
            return `<tr>
              <td>${when(p.signed?.blockTimestamp)}</td>
              <td>${badge(p.state)}</td>
              <td>${amount}</td>
              <td>${landed}</td>
              <td class="r">${eventLink(p.signed)}</td>
            </tr>`;
          })
          .join("");
        return `
          <div class="panel">
            <div class="panel-head"><span class="t">Payouts</span><span class="note">deliveries batch the output of one or more tranches</span></div>
            <table class="tbl">
              <thead><tr><th>Time</th><th>Kind</th><th>Amount</th><th>Received</th><th class="r">NEAR tx</th></tr></thead>
              <tbody>${rows || `<tr><td class="table-error" colspan="5">none yet</td></tr>`}</tbody>
            </table>
          </div>`;
      }

      let tokens = { hydration: {} };

      /** What the plan sold: the Hydration asset its ICE trades sold, else the ETH itself. */
      function sold(plan) {
        if (plan.asset_in == null) return asset(plan.sold, ETH, "", chainIcon("ethereum"));
        const meta = tokens.hydration[plan.asset_in];
        return asset(plan.amount_in, meta, `#${plan.asset_in}`, assetIcon(meta?.icon ?? plan.asset_in));
      }

      function render(data) {
        if (!data) {
          main.innerHTML = `<div class="panel"><div class="table-error">no plan ${esc(short(path, 10, 8))}</div></div>`;
          return;
        }
        const { plan, orders, payouts: list } = data;
        const d = DEST[plan.destination_asset];
        const chain = plan.recipient_kind === 1 ? "near" : (d?.chain ?? null);
        const deadline = plan.deadline ? Number(plan.deadline) * 1000 : null;
        const dca = plan.tranches > 1;

        const terms = [
          kv("type", dca ? pill(`DCA · ${plan.tranches} tranches`, "var(--lavender)") : pill("swap", "var(--sky)")),
          kv("buys", esc(d?.symbol ?? plan.destination_asset ?? "—")),
          kv("recipient", addrLink(plan.recipient, chain)),
          kv("delivered as", plan.recipient_kind === 1 ? "an intents account on NEAR" : "a withdrawal to its chain"),
          kv("owner", addrLink(plan.owner, "hydration")),
          kv("refund to", addrLink(plan.refund_to, "ethereum")),
          kv("deadline", deadline ? esc(at(deadline)) : dim("—")),
          kv("sold", sold(plan)),
          plan.asset_in != null ? kv("as ETH", asset(plan.sold, ETH, "", chainIcon("ethereum"))) : "",
          kv("received", Number(plan.received) > 0 ? asset(plan.received, d, plan.destination_asset ?? "", chainIcon(chain)) : dim("nothing yet")),
          kv("auth path", `<span class="mono">${esc(short(plan.auth_path, 10, 8))}</span>${copyBtn(plan.auth_path)}`),
          kv("terms", `<span class="mono">${esc(short(plan.terms, 10, 8))}</span>${copyBtn(plan.terms)}`),
        ].join("");

        main.innerHTML = `
          <h1 class="page-title tagged">${dca ? "DCA" : "Swap"} ${esc(d?.symbol ?? "")} <span class="sub">${badge(plan.status)}</span>${versionTag("v2")}</h1>
          <div class="panel">
            <div class="panel-head"><span class="t">Terms</span></div>
            ${terms}
          </div>
          ${tranches(orders)}
          ${payouts(plan, list)}`;
      }

      async function load() {
        const [data, t] = await Promise.all([json(`${API}/plans/${encodeURIComponent(path)}`), json(`${API}/tokens`)]);
        if (t) tokens = t;
        render(data);
      }

      live(
        "orders-v2,payouts-v2",
        (u) => {
          if (u.record?.auth_path === path) load();
        },
        load,
        API,
      );
    </script>
  </body>
</html>
