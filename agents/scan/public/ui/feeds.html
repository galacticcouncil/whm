<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Feeds · Hydration scan</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preload" href="/fonts/GazpachoMedium-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMonoMedium-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <main class="wrap">
      <div class="list-head">
        <div class="list-title"><span class="conn"><span class="dot"></span></span>Live feeds</div>
      </div>
      <div class="feed-grid" id="grid"></div>
      <div id="dead" hidden>
        <div class="list-head">
          <div class="list-title">
            <span class="skull" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="12" r="1" /><circle cx="15" cy="12" r="1" /><path d="M8 20v2h8v-2" />
                <path d="m12.5 17-.5-1-.5 1h1z" />
                <path d="M16 20a2 2 0 0 0 1.56-3.25 8 8 0 1 0-11.12 0A2 2 0 0 0 8 20" />
              </svg>
            </span>Dead feeds
          </div>
          <span class="list-note">nothing delivered for a week</span>
        </div>
        <div class="feed-grid" id="dead-grid"></div>
      </div>
    </main>

    <script type="module">
      import {
        NAV,
        agoLong,
        at,
        chainBadge,
        esc,
        json,
        live,
        tokenIcon,
        topbar,
      } from "/shared/app.js";
      import { fmt, sparkline } from "/chart.js";

      topbar("scan", NAV, { conn: false });

      /** This section's app, through the UI's proxy. */
      const API = "/api/feeds";

      const el = (id) => document.getElementById(id);

      /**
       * A feed whose receiver has written nothing for this long is dead — however often its emitter
       * still publishes, the oracle on the other side is not moving. Only once its destination is
       * indexed that far, though: a chain still backfilling has delivered nothing recent for anyone.
       */
      const DEAD_AFTER_MS = 7 * 86_400_000;
      const recent = (ms) => ms !== null && ms !== undefined && Date.now() - ms <= DEAD_AFTER_MS;
      const dead = (f) => recent(f.receiver.indexedTo) && !recent(f.delivered?.deliveredAt);

      /**
       * One feed: what it is, where it goes, what it says now, and its week.
       *
       * @param {object} f A feed, as `/api/feeds` returns it.
       */
      function card(f) {
        // What the oracle holds, and when its receiver wrote it — never what was merely published.
        const gone = dead(f);
        const latest = f.delivered;
        const unit = f.kind === "rate" ? `<span class="unit">${esc(f.unit)}</span>` : "";
        const when = latest
          ? `<span title="${esc(at(latest.deliveredAt))}">updated ${esc(agoLong(latest.deliveredAt))}</span>`
          : "never updated";
        // Published but refused shows only where the receiver wrote fewer than the emitter sent.
        const refused = f.published24h > f.updates24h ? ` · ${f.published24h} published` : "";
        return `<a class="feed-card${gone ? " dead" : ""}" href="/feed/${encodeURIComponent(f.id)}">
          <div class="fc-head">
            ${tokenIcon({ symbol: f.symbol, assetId: f.icon, home: f.source }, 22)}
            <span class="fc-name">${esc(f.symbol)}</span>
            <span class="fc-route">${chainBadge(f.source)}<span class="dim">→</span>${chainBadge(f.receiver.chain)}</span>
          </div>
          <div class="fc-value">${esc(fmt(latest?.value ?? null, f))}${unit}</div>
          <div class="fc-sub">${f.kind} · ${when} · ${f.updates24h} in 24H${refused}</div>
          ${sparkline(f.spark)}
        </a>`;
      }

      /** Skeleton cards, the grid's own shape, until the first answer. */
      el("grid").innerHTML = Array.from(
        { length: 6 },
        () => '<div class="feed-card"><div class="spark-empty">loading…</div></div>',
      ).join("");

      async function load() {
        const feeds = await json(`${API}/feeds`);
        if (!feeds) {
          el("grid").innerHTML =
            '<div class="panel"><div class="table-error"><strong>Could not load feeds.</strong></div></div>';
          return;
        }
        const active = feeds.filter((f) => !dead(f));
        const gone = feeds.filter(dead);
        el("grid").innerHTML = active.length
          ? active.map(card).join("")
          : '<div class="panel"><div class="table-error">No feed has updated this week.</div></div>';
        el("dead").hidden = gone.length === 0;
        el("dead-grid").innerHTML = gone.map(card).join("");
      }

      // Any update redraws the grid — seven cards are cheaper to redraw than to diff. A burst coalesces,
      // and the ages tick on their own.
      let pending;
      live(
        "oracle",
        () => {
          clearTimeout(pending);
          pending = setTimeout(load, 500);
        },
        load,
        API,
      );
      setInterval(load, 30_000);
    </script>
  </body>
</html>
